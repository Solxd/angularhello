<div class="container mt-4">
  <h2 class="text-primary mb-3">Gestión de Alumnos</h2>

  <!-- Formulario estilizado con Bootstrap -->
  <form (ngSubmit)="guardarAlumno()" class="card p-3 bg-light mb-4 shadow-sm" style="max-width: 400px;">
    <div class="mb-3">
      <label class="form-label">Nombre:</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoAlumno.nombre" name="nombre" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Edad</label>
      <input type="number" class="form-control" [(ngModel)]="nuevoAlumno.edad" name="edad" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Guardar Alumno</button>
  </form>

  <!-- Tabla estilizada con Bootstrap -->
  <h3 class="h4 text-secondary mb-3">Listado de Alumnos</h3>
  
  <div class="table-responsive" *ngIf="listaAlumnos.length > 0; else sinDatos">
    <table class="table table-striped table-hover border">
      <thead class="table-dark">
        <ng-template #sinDatos>
  <p class="alert alert-warning">No hay alumnos registrados.</p>
</ng-template>
        <tr>
          <th>Nombre</th>
          <th>Edad</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of listaAlumnos">
          <td>{{ alumno.nombre }}</td>
          <td>{{ alumno.edad }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #sinDatos>
    <div class="alert alert-info" role="alert">
      No hay alumnos registrados aún.
    </div>
  </ng-template>
</div>
