<div class="container mt-4">
  <h2 class="text-primary mb-3">Gestión de Cursos</h2>

  <!-- Formulario -->
  <form (ngSubmit)="guardarCurso()" class="card p-3 bg-light mb-4 shadow-sm" style="max-width: 400px;">
    <div class="mb-3">
      <label class="form-label fw-bold">Nombre del Curso:</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoCurso.nombre" name="nombreCurso" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">Duración (ej. 4 meses):</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoCurso.duracion" name="duracion" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Guardar Curso</button>
  </form>

  <!-- Tabla -->
  <h3 class="h4 text-secondary mb-3">Listado de Cursos</h3>
  <div *ngIf="listaCursos.length > 0; else sinCursos" class="table-responsive">
    <table class="table table-striped table-hover border">
      <thead class="table-dark">
        <tr>
          <th>Curso</th>
          <th>Duración</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let curso of listaCursos">
          <td>{{ curso.nombre }}</td>
          <td>{{ curso.duracion }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #sinCursos>
    <div class="alert alert-info">No hay cursos registrados aún.</div>
  </ng-template>
</div>
